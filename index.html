<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087ea4">
  <title>블루 키퍼 | 부산 환경보호 게임</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{--blue:#087ea4;--sea:#22b6c9;--green:#39aa77;--ink:#123d55;--bg:#e5f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,'Malgun Gothic',sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:500px;min-height:100vh;margin:auto;background:#f8feff;padding:18px 16px 92px}.page{display:none}.page.on{display:block}.hero{color:white;border-radius:28px;padding:20px;background:linear-gradient(145deg,#087ea4,#22b6c9 62%,#7bddc8);overflow:hidden}.hero h1{margin:0;font-size:29px}.hero p{margin:7px 0}.bird{text-align:center;font-size:100px;line-height:1.05;filter:drop-shadow(0 7px 4px #05526955)}.pill{display:inline-block;background:#ffffffdf;color:#07526d;border-radius:20px;padding:7px 12px;font-weight:800}.card{background:white;border:1px solid #d7edf0;border-radius:18px;margin:11px 0;padding:14px;box-shadow:0 2px 8px #1360700b}.row{display:flex;align-items:center;gap:12px}.row>div:nth-child(2){flex:1}.icon{font-size:31px}.card b{display:block}.card small{color:#557889}.bar{height:9px;background:#dce9e9;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green);border-radius:9px}.health{background:#fff5e1}.health strong{color:#bf7413;float:right}.btn{border:0;border-radius:12px;padding:10px 12px;background:var(--blue);color:white;font-weight:800}.btn.green{background:var(--green)}.btn.gray{background:#718995}.btn.danger{background:#d85d54}.btn:disabled{background:#bdcbd0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#fff;border-top:1px solid #d8ebed;display:flex;justify-content:space-around;padding:9px 3px}.nav button{background:none;border:0;color:#5b8390;font-size:12px}.nav button.on{color:var(--blue);font-weight:900}.nav span{display:block;font-size:20px}.modal{position:fixed;inset:0;background:#073a5ab8;display:grid;place-items:center;padding:18px;z-index:10}.panel{background:white;border-radius:24px;padding:20px;width:min(100%,440px);max-height:92vh;overflow:auto}.hide{display:none}.preview{display:none;max-width:100%;max-height:220px;border-radius:13px;margin:9px 0}.notice{background:#e6f7fb;color:#17627a;border-radius:12px;padding:11px;font-size:13px;line-height:1.55}.tag{display:inline-block;border-radius:9px;padding:3px 7px;font-size:12px;font-weight:bold;background:#e4f7ed;color:#167148}.wait{background:#fff2d9;color:#a86710}.reject{background:#fee7e5;color:#b44740}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.submission{border-left:5px solid #e8a62b}.submission img{width:80px;height:80px;object-fit:cover;border-radius:12px}.empty{text-align:center;color:#65828c;padding:28px 8px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.admin-lock{text-align:center;padding:24px}.admin-lock input{width:100%;padding:11px;border:1px solid #b8d5da;border-radius:10px;margin:8px 0}.record-time{font-size:12px;color:#69858d;margin-top:5px}#busanMap{height:360px;border-radius:18px;margin-top:12px;overflow:hidden}.leaflet-popup-content{font-family:system-ui,'Malgun Gothic',sans-serif;font-size:13px;line-height:1.55}
  </style>
</head>
<body>
<main class="app">
  <section id="home" class="page on"></section>
  <section id="mission" class="page"></section>
  <section id="growth" class="page"></section>
  <section id="map" class="page"></section>
  <section id="profile" class="page"></section>
</main>
<nav class="nav">
  <button class="on" data-page="home"><span>🏠</span>홈</button><button data-page="mission"><span>🎯</span>미션</button><button data-page="growth"><span>🌱</span>성장</button><button data-page="map"><span>🗺️</span>부산</button><button data-page="profile"><span>👤</span>마이</button>
</nav>
<div id="modal" class="modal hide"></div>
<script>
const missions=[
 {icon:'♻️',name:'분리배출 인증',place:'실내',xp:20,vol:0}, {icon:'🥤',name:'텀블러 사용하기',place:'실내',xp:15,vol:0},
 {icon:'🚌',name:'대중교통 이용하기',place:'야외',xp:45,vol:0}, {icon:'🧤',name:'해변 쓰레기 줍기',place:'야외',xp:60,vol:1},
 {icon:'🚶',name:'플로깅 활동',place:'야외',xp:55,vol:1}, {icon:'🍽️',name:'일회용품 줄이기',place:'실내',xp:15,vol:0}
];
const chars=[['🕊️','갈매기 부기'],['🐳','아기 고래'],['🐢','바다거북'],['🦦','수달']];
const initial={char:0,xp:0,points:0,sea:42,completed:[],submissions:[],records:[],admin:false};
let state;try{state=JSON.parse(localStorage.getItem('blueKeeperV3'))||initial}catch{state=initial}
function save(){localStorage.setItem('blueKeeperV3',JSON.stringify(state))}
function level(){return Math.min(30,1+Math.floor(state.xp/100))}function levelName(){let l=level();return l>=30?'환경 수호자':l>=20?'그린 히어로':l>=10?'블루 키퍼':l>=5?'환경 지킴이':'새싹'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){renderHome();renderMission();renderGrowth();renderMap();renderProfile()}
function renderHome(){let c=chars[state.char];home.innerHTML=`<div class="hero"><h1>BLUE KEEPER</h1><p>부산 바다를 지키는 친환경 게임</p><div class="bird">${c[0]}</div><span class="pill">Lv.${level()} · ${levelName()}</span></div><div class="card health"><strong>${state.sea} / 100</strong><b>오늘의 부산 바다 건강도</b><div class="bar"><i style="width:${state.sea}%"></i></div><small>${state.sea<55?c[1]+'가 걱정하고 있어요. 미션으로 바다를 도와주세요!':c[1]+'가 건강한 바다를 좋아해요!'}</small></div><h2>오늘의 환경 미션</h2>${missions.slice(0,3).map((m,i)=>missionCard(m,i)).join('')}<button class="btn green" onclick="go('mission')">모든 미션 보기</button>`}
function missionCard(m,i){let done=state.completed.includes(i),waiting=state.submissions.some(x=>x.mission===i&&x.status==='waiting');return `<div class="card row"><div class="icon">${m.icon}</div><div><b>${m.name}</b><small>${m.place==='야외'?'야외 미션 · 높은 보상':'실내 미션'} · +${m.xp} EXP${m.vol?' · 봉사 1시간':''}</small></div><button class="btn" ${done||waiting?'disabled':''} onclick="openSubmit(${i})">${done?'완료':waiting?'승인 대기':'인증'}</button></div>`}
function renderMission(){mission.innerHTML=`<h1>환경 미션</h1><div class="notice">사진을 올리면 바로 보상이 지급되지 않습니다. <b>관리자 승인</b> 후에만 EXP와 봉사시간이 기록됩니다.</div>${missions.map((m,i)=>missionCard(m,i)).join('')}`}
function renderGrowth(){let c=chars[state.char],pct=state.xp%100;growth.innerHTML=`<h1>캐릭터 성장</h1><div class="card row"><div class="bird" style="font-size:80px">${c[0]}</div><div><b>${c[1]}</b><small>Lv.${level()} ${levelName()} · ${state.xp} EXP</small><div class="bar"><i style="width:${pct}%"></i></div></div></div><div class="card"><b>성장 단계</b><p>Lv.1 새싹 → Lv.5 환경 지킴이 → Lv.10 블루 키퍼 → Lv.20 그린 히어로 → Lv.30 환경 수호자</p><button class="btn" onclick="chooseChar()">캐릭터 바꾸기</button></div>`}
function renderMap(){if(busanLeaflet){busanLeaflet.remove();busanLeaflet=null}map.innerHTML=`<h1>부산 환경 현황</h1><p>실제 부산 해안 지도에서 지역을 눌러 환경 문제를 확인하세요.</p><div id="busanMap"></div><div class="info-grid"><div class="card"><b>🔴 해운대</b><small>해양 쓰레기</small></div><div class="card"><b>🔵 광안리</b><small>미세플라스틱</small></div><div class="card"><b>🟣 송정</b><small>해변 쓰레기</small></div><div class="card"><b>🟢 영도</b><small>수질·해양 쓰레기</small></div></div><div class="notice">표시는 환경교육용 안내입니다. 실시간 공식 측정값을 제공하려면 공공데이터 API 연결이 필요합니다.</div>`}
let busanLeaflet=null;
function drawMap(){if(!window.L)return;let box=document.getElementById('busanMap');if(!box)return;if(busanLeaflet){busanLeaflet.invalidateSize();return}let m=L.map(box,{scrollWheelZoom:false}).setView([35.137,129.134],11);busanLeaflet=m;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(m);let sites=[['송정해수욕장','해변 쓰레기','서핑·관광 지역의 해변 정화가 필요해요.',35.1782,129.1993,'#8b66c7'],['해운대해수욕장','해양 쓰레기','해변 이용 후 쓰레기 되가져가기가 중요해요.',35.1586,129.1604,'#e87562'],['광안리해수욕장','미세플라스틱','해안 미세플라스틱 관찰과 정화 활동 지역이에요.',35.1532,129.1186,'#218fc1'],['영도구','수질·해양 쓰레기','항만과 해안 생태계 보호가 필요한 지역이에요.',35.0919,129.0675,'#39aa77']];let bounds=[];sites.forEach(s=>{L.circleMarker([s[3],s[4]],{radius:10,color:'#fff',weight:3,fillColor:s[5],fillOpacity:1}).addTo(m).bindPopup(`<b>${s[0]}</b><br>환경 문제: ${s[1]}<br>${s[2]}`);bounds.push([s[3],s[4]])});m.fitBounds(bounds,{padding:[28,28]})}
function renderProfile(){let hours=state.records.reduce((a,x)=>a+x.hours,0);profile.innerHTML=`<div class="topline"><h1>마이페이지</h1><button class="btn gray" onclick="openAdmin()">관리자 승인함</button></div><div class="card row"><div class="bird" style="font-size:65px">${chars[state.char][0]}</div><div><b>${chars[state.char][1]}</b><small>Lv.${level()} ${levelName()}</small></div></div><div class="info-grid"><div class="card"><b>${state.xp} EXP</b><small>획득 경험치</small></div><div class="card"><b>${state.points} P</b><small>포인트</small></div><div class="card"><b>${hours}시간</b><small>승인된 봉사시간</small></div><div class="card"><b>${state.submissions.filter(x=>x.status==='waiting').length}건</b><small>승인 대기</small></div></div><h2>활동 기록</h2>${state.records.length?state.records.map(x=>`<div class="card"><b>${esc(x.name)}</b><small>승인 완료 · +${x.xp} EXP${x.hours?' · 봉사 '+x.hours+'시간':''}</small><div class="record-time">${x.date}</div></div>`).join(''):'<div class="empty">아직 승인된 활동이 없어요.</div>'}`}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.page===id));if(id==='map')setTimeout(drawMap,120);window.scrollTo(0,0)}
function openSubmit(i){let m=missions[i];modal.classList.remove('hide');modal.innerHTML=`<div class="panel"><h2>${m.icon} ${m.name}</h2><div class="notice"><b>사진에 꼭 보여야 하는 요소</b><br>${m.name} 활동 장면과 관련 물건·장소가 선명하게 보여야 합니다. 얼굴, 주소 등 개인정보는 가려주세요.</div><input id="photo" type="file" accept="image/*" onchange="previewPhoto(this)"><img id="preview" class="preview"><p><label><input id="volunteer" type="checkbox" ${m.vol?'checked':''}> 봉사활동으로 신청합니다</label></p><button class="btn green" onclick="sendSubmission(${i})">관리자 승인 요청</button> <button class="btn gray" onclick="closeModal()">취소</button></div>`}
function previewPhoto(input){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}
function sendSubmission(i){let f=photo.files[0];if(!f){alert('활동 인증 사진을 선택해 주세요.');return}let r=new FileReader;r.onload=()=>{state.submissions.push({id:Date.now(),mission:i,name:missions[i].name,image:r.result,status:'waiting',volunteer:volunteer.checked,date:new Date().toLocaleString('ko-KR')});save();closeModal();render();alert('관리자 승인함으로 보냈습니다. 승인될 때까지 보상은 지급되지 않습니다.')};r.readAsDataURL(f)}
function chooseChar(){modal.classList.remove('hide');modal.innerHTML=`<div class="panel"><h2>친구 고르기</h2>${chars.map((c,i)=>`<button class="card" style="width:100%;text-align:left" onclick="setChar(${i})"><span class="icon">${c[0]}</span> <b>${c[1]}</b></button>`).join('')}<button class="btn gray" onclick="closeModal()">닫기</button></div>`}function setChar(i){state.char=i;save();closeModal();render()}
function area(name,issue,text){alert(`${name}\n환경 문제: ${issue}\n${text}`)}function closeModal(){modal.classList.add('hide');modal.innerHTML=''}
function openAdmin(){if(!state.admin){modal.classList.remove('hide');modal.innerHTML=`<div class="panel admin-lock"><h2>관리자 승인함</h2><p>이 컴퓨터에서만 사용하는 관리자 화면입니다.</p><input id="adminPass" type="password" placeholder="관리자 비밀번호"><button class="btn" onclick="unlockAdmin()">열기</button><p><small>처음 비밀번호: 1234<br>배포 전 반드시 코드에서 비밀번호를 변경하세요.</small></p><button class="btn gray" onclick="closeModal()">취소</button></div>`}else showAdmin()}
function unlockAdmin(){if(adminPass.value!=='1234'){alert('비밀번호가 맞지 않습니다.');return}state.admin=true;save();showAdmin()}
function showAdmin(){modal.classList.remove('hide');let wait=state.submissions.filter(x=>x.status==='waiting');modal.innerHTML=`<div class="panel"><div class="topline"><h2>관리자 승인함</h2><button class="btn gray" onclick="closeModal()">닫기</button></div><div class="notice">사진을 직접 확인한 뒤 승인 또는 거절을 선택하세요. 승인 시에만 보상이 지급됩니다.</div>${wait.length?wait.map(x=>`<div class="card submission"><div class="row"><img src="${x.image}" alt="인증 사진"><div><b>${esc(x.name)}</b><small>${x.date}${x.volunteer?' · 봉사활동':''}</small></div></div><p><button class="btn green" onclick="approve(${x.id})">승인 및 보상 지급</button> <button class="btn danger" onclick="reject(${x.id})">거절</button></p></div>`).join(''):'<div class="empty">승인 대기 중인 사진이 없습니다.</div>'}</div>`}
function approve(id){let s=state.submissions.find(x=>x.id===id),m=missions[s.mission];s.status='approved';state.completed.push(s.mission);state.xp+=m.xp;state.points+=m.xp;state.sea=Math.min(100,state.sea+(m.place==='야외'?6:3));state.records.push({name:m.name,xp:m.xp,hours:s.volunteer?1:0,date:new Date().toLocaleString('ko-KR')});save();render();showAdmin();alert('승인 완료! 보상이 지급되었습니다.')}
function reject(id){let reason=prompt('거절 이유를 입력하세요. (예: 활동 장면이 사진에 보이지 않음)');if(!reason)return;let s=state.submissions.find(x=>x.id===id);s.status='rejected';s.reason=reason;save();render();showAdmin();alert('거절 처리되었습니다. 이유: '+reason)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script>
</body></html>
